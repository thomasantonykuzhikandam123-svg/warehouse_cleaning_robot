### Nav2 parameters for warehouse_robot
### Tuned for: 2-wheel diff drive, 0.45m wheel separation, lidar /scan,
### EKF-fused odom (odom->base_link at 30Hz), map origin [-4,-4].

#############################################
# AMCL — localizes robot on the map using lidar
#############################################
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
    # Motion model for differential drive robot
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Particle filter size
    min_particles: 500
    max_particles: 2000
    # How much we trust odometry vs need correction (diff-drive noise params)
    alpha1: 0.2   # rotation noise from rotation
    alpha2: 0.2   # rotation noise from translation
    alpha3: 0.2   # translation noise from translation
    alpha4: 0.2   # translation noise from rotation
    # Laser model
    laser_model_type: "likelihood_field"
    laser_max_range: 8.0          # matches your lidar max
    laser_min_range: 0.15         # matches your lidar min
    max_beams: 60                 # beams used for matching (60 of 360 — efficient)
    # When to update the filter (robot must move this much)
    update_min_d: 0.2             # metres
    update_min_a: 0.2             # radians
    # Resampling
    resample_interval: 1
    transform_tolerance: 1.0
    # Initial pose covariance (how unsure we are at start)
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

#############################################
# MAP SERVER — loads your warehouse map
#############################################
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "warehouse_map.yaml"

#############################################
# PLANNER — global path planning (A*-like)
#############################################
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5            # how close to goal counts as reached
      use_astar: true          # use A* (vs Dijkstra)
      allow_unknown: false     # don't plan through unknown cells

#############################################
# CONTROLLER — local path following (drives the robot)
#############################################
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]
    # Goal checker — when have we arrived?
    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5
      stateful: true
    # Progress checker — are we actually moving?
    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0
    # The actual controller — DWB (Dynamic Window) for diff drive
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      # Velocity limits — tuned for your robot
      min_vel_x: 0.0
      max_vel_x: 0.3            # forward speed (matches your robot)
      min_vel_y: 0.0
      max_vel_y: 0.0            # diff drive can't move sideways
      max_vel_theta: 1.0        # turn speed
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0
      # Acceleration limits
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      # Trajectory sampling
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      # Critics — what the controller optimizes for
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

#############################################
# GLOBAL COSTMAP — map-wide obstacle awareness
#############################################
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      robot_radius: 0.3          # your robot's radius (0.6×0.4 body → ~0.3)
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55     # safety buffer around obstacles
      always_send_full_costmap: true

#############################################
# LOCAL COSTMAP — robot-centered, for live avoidance
#############################################
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.3
      rolling_window: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

#############################################
# BEHAVIOR TREE NAVIGATOR
#############################################
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.1

#############################################
# RECOVERY BEHAVIORS — what to do when stuck
#############################################
behavior_server:
  ros__parameters:
    use_sim_time: true
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

#############################################
# LIFECYCLE MANAGER — starts all Nav2 nodes in order
#############################################
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["map_server", "amcl", "controller_server",
                 "planner_server", "behavior_server", "bt_navigator"]